AWSTemplateFormatVersion: '2010-09-09'
Description: Run a single Cygnus build on ECS Fargate.

Parameters:
  BucketName:
    Type: String
  DeploymentId:
    Type: String
    AllowedPattern: '[a-z1-9]{5}'
  VpcId:
    Type: AWS::EC2::VPC::Id
  ImageTag:
    Type: String
    Default: v1

Resources:
  Cluster:
    Type: AWS::ECS::Cluster

  RunnerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-runner'
      ImageTagMutability: IMMUTABLE

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow outbound HTTPS for the Cygnus build runner
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullRunnerImageAndWriteLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt RunnerRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BuildLogs}:log-stream:*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
                Condition:
                  StringEquals:
                    's3:prefix': !Sub 'output/${DeploymentId}/'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/output/${DeploymentId}/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/dist/${DeploymentId}/*'

  RunnerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: runner
          Image: !Sub '${RunnerRepository.RepositoryUri}:${ImageTag}'
          Essential: true
          Command: [!Ref DeploymentId]
          Environment:
            - Name: BUCKET
              Value: !Ref BucketName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BuildLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: build

Outputs:
  Cluster:
    Value: !Ref Cluster
  RepositoryUri:
    Value: !GetAtt RunnerRepository.RepositoryUri
  TaskDefinition:
    Value: !Ref RunnerTask
  SecurityGroup:
    Value: !Ref RunnerSecurityGroup
  LogGroup:
    Value: !Ref BuildLogs
